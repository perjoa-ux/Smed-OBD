name: Smed Nettvakt tests
on:
  push:
    paths:
      - "bridge/nettvakt*"
      - "bridge/server.mjs"
      - ".github/workflows/nettvakt-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check bridge/server.mjs
          node --check bridge/nettvakt-dashboard.mjs
          node --check bridge/nettvakt-dashboard.js
      - name: Nettvakt tests
        run: node --test bridge/nettvakt.test.mjs bridge/nettvakt-dashboard.test.mjs
