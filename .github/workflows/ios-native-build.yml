name: Native iOS build
on:
  push:
    branches: [ios-background-ble]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native-build.yml'
  pull_request:
    paths:
      - 'ios/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Compile for simulator
        run: |
          cd ios
          xcodebuild -project SmedOBDNative.xcodeproj -scheme SmedOBDNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
