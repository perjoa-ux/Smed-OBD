<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smed OBD v0.4</title><style>body{background:#071121;color:#e8f0fc;font:17px system-ui;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:2rem}section{background:#18283f;border:1px solid #384f6e;border-radius:18px;padding:18px;margin:16px 0}button,select,input{font:inherit;border-radius:10px;padding:13px;background:#263b56;border:1px solid #64809e;color:#fff;max-width:100%}button{cursor:pointer;margin:5px 4px 5px 0}button.primary{background:#1869b5}button:disabled{opacity:.45}input{box-sizing:border-box;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#071121;border-radius:12px;padding:13px;max-height:420px;overflow:auto}small{color:#a8bcd5}#status{font-weight:bold;color:#ffca83}.muted{color:#a7bbd3}</style></head><body><main><h1>🔧 Smed OBD</h1><p class="muted">v0.4 • Bluetooth-diagnostikk • kun lesing</p><section><h2>1. Tilkobling</h2><p id="status">Ikke tilkoblet</p><button id="connect" class="primary">Koble til BLE-adapter</button><button id="disconnect" disabled>Koble fra</button><p id="env"></p><small>Bruk Bluefy på iPhone. Ikke åpne KDIAG-appen samtidig.</small><div id="channels"></div></section><section><h2>2. Lesekommandoer</h2><p><button data-cmd="ATI">ATI – adapter-ID</button><button data-cmd="ATE0">ATE0</button><button data-cmd="ATL0">ATL0</button><button data-cmd="ATH1">ATH1</button><button data-cmd="ATSP6">ATSP6</button><button data-cmd="0100">0100 – PIDs</button><button data-cmd="010C">010C – turtall</button><button data-cmd="0105">0105 – temperatur</button><button data-cmd="ATSH7E0">ATSH7E0</button><button data-cmd="2115">2115 – Mitsubishi rådata</button></p><input id="cmd" placeholder="F.eks. ATI eller 2115"><button id="send">Send lesekommando</button><p><small>Ingen nullstilling eller sletting. 2115 vises kun som rådata.</small></p><h3>Siste svar</h3><pre id="answer">–</pre></section><section><h2>3. Kommunikasjonslogg</h2><button id="copy">Kopier logg</button><button id="export">Eksporter .txt</button><button id="clear">Tøm logg</button><pre id="log"></pre></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let device=null,server=null,tx=null,rx=null,loglines=[];
function log(level,message,extra){const detail=extra===undefined?'': ' '+extra;const line=`${new Date().toISOString()} [${level}] ${message}${detail}`;loglines.push(line);$('log').textContent=loglines.join('\n');console.log(line)}
function describe(e){if(e==null)return String(e);if(typeof e==='string')return e;let name='',msg='',stack='';try{name=e.name||'';msg=e.message||'';stack=e.stack||''}catch{}return [name,msg,stack].filter(Boolean).join(' | ') || String(e) || JSON.stringify(e) || 'Ukjent feilobjekt'}
function status(s){$('status').textContent=s}
function reset(){tx=null;rx=null;server=null;$('channels').innerHTML='';$('disconnect').disabled=true;status('Ikke tilkoblet')}
function addSelect(container,label,items,selected,onchange){const l=document.createElement('label');l.textContent=label+' ';const s=document.createElement('select');const blank=document.createElement('option');blank.textContent='Velg kanal';blank.value='';s.append(blank);for(const it of items){const o=document.createElement('option');o.value=it.id;o.textContent=it.name;s.append(o)}s.value=selected||'';s.addEventListener('change',()=>onchange(s.value));l.append(s);container.append(l);container.append(document.createElement('br'))}
const known=['0000ffe0-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb','0000ffe1-0000-1000-8000-00805f9b34fb','0000fff1-0000-1000-8000-00805f9b34fb','0000fff2-0000-1000-8000-00805f9b34fb','0000fff3-0000-1000-8000-00805f9b34fb','0000fff4-0000-1000-8000-00805f9b34fb','0000fff5-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb'];
function writable(c){return !!(c.properties.write||c.properties.writeWithoutResponse)}function readable(c){return !!(c.properties.notify||c.properties.indicate)}
async function connect(){log('INFO','Tilkoblingsknapp trykket');try{const secure=window.isSecureContext;const available=!!navigator.bluetooth;log('INFO',`Miljø: HTTPS/sikker=${secure}; navigator.bluetooth=${available}; agent=${navigator.userAgent}`);if(!secure)throw new Error('Siden er ikke i sikker HTTPS-kontekst');if(!available)throw new Error('navigator.bluetooth er ikke tilgjengelig i denne nettleseren. Åpne direkte i Bluefy, ikke Safari/ChatGPT-innebygd visning.');status('Åpner enhetsvelger…');log('INFO','Kaller navigator.bluetooth.requestDevice');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:known});log('INFO',`Valgt enhet: ${device.name||'(uten navn)'} (${device.id||'ukjent ID'})`);device.addEventListener('gattserverdisconnected',()=>{log('INFO','BLE frakoblet');reset()});status('Kobler til GATT…');server=await device.gatt.connect();log('INFO','GATT tilkoblet');status('BLE tilkoblet – undersøker kanaler');$('disconnect').disabled=false;const services=await server.getPrimaryServices();log('INFO','Tilgjengelige tjenester: '+services.map(s=>s.uuid).join(', '));let chars=[];for(const s of services){try{for(const c of await s.getCharacteristics()){chars.push({id:s.uuid+'|'+c.uuid,c,name:s.uuid+' / '+c.uuid});log('INFO',`Kanal ${c.uuid}: write=${c.properties.write}, writeNoResp=${c.properties.writeWithoutResponse}, notify=${c.properties.notify}, indicate=${c.properties.indicate}`)}}catch(e){log('FEIL','Kan ikke lese karakteristikker i '+s.uuid,describe(e))}}const out=chars.filter(x=>writable(x.c)),inbound=chars.filter(x=>readable(x.c));const container=$('channels');container.innerHTML='';addSelect(container,'Skrivekanal',out,out.length===1?out[0].id:'',v=>{tx=out.find(x=>x.id===v)?.c||null;log('INFO','Valgt skrivekanal: '+(tx?.uuid||'ingen'))});if(out.length===1)tx=out[0].c;addSelect(container,'Svarkanal',inbound,inbound.length===1?inbound[0].id:'',async v=>{rx=inbound.find(x=>x.id===v)?.c||null;if(rx)await enableResponse()});if(inbound.length===1){rx=inbound[0].c;await enableResponse()}if(!chars.length)log('VARSEL','Ingen karakteristikker. Adapteren kan bruke en tjeneste-UUID som ikke er oppgitt i optionalServices.');status('BLE tilkoblet'+(tx&&rx?' – kanaler klare':' – velg kanaler'));}catch(e){log('FEIL','Bluetooth-tilkobling',describe(e));status('Tilkobling feilet – se logg');}}
async function enableResponse(){try{await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',ev=>{const d=ev.target.value;const bytes=new Uint8Array(d.buffer,d.byteOffset,d.byteLength);const text=new TextDecoder().decode(bytes);$('answer').textContent+=text;log('RX',JSON.stringify(text),'HEX='+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join(' '))});log('INFO','Svarkanal aktivert '+rx.uuid)}catch(e){log('FEIL','Varsling fra svarkanal',describe(e))}}
async function send(command){command=(command||'').trim().toUpperCase();if(!/^(ATI|ATE0|ATL0|ATH1|ATSP6|ATSH7E0|0100|010C|0105|03|2115)$/.test(command)){log('FEIL','Kommando ikke på leselisten '+command);return}if(!tx){log('FEIL','Ingen skrivekanal valgt / ikke tilkoblet');return}try{const bytes=new TextEncoder().encode(command+'\r');$('answer').textContent='';if(tx.properties.writeWithoutResponse)await tx.writeValueWithoutResponse(bytes);else await tx.writeValueWithResponse(bytes);log('TX',command)}catch(e){log('FEIL','Sending '+command,describe(e))}}
$('connect').onclick=connect;$('disconnect').onclick=()=>{try{device?.gatt?.disconnect()}catch(e){log('FEIL','Frakobling',describe(e))}reset()};$('send').onclick=()=>send($('cmd').value);document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));$('clear').onclick=()=>{loglines=[];$('log').textContent='';log('INFO','Logg tømt')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(loglines.join('\n'));log('INFO','Logg kopiert')}catch(e){log('FEIL','Kopiering',describe(e))}};$('export').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([loglines.join('\n')],{type:'text/plain'}));a.href=url;a.download='smed-obd-v04-logg.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('env').textContent=`Sikker side: ${window.isSecureContext?'ja':'nei'} • Web Bluetooth API: ${navigator.bluetooth?'tilgjengelig':'mangler'}`;log('INFO','Smed OBD v0.4 startet – ingen simulert adapter eller ECU');window.addEventListener('unhandledrejection',e=>log('FEIL','Ubehandlet promise',describe(e.reason)));window.addEventListener('error',e=>log('FEIL','JavaScript',`${e.message} @ ${e.filename}:${e.lineno}`));})();
</script></body></html>
